# H-SCM variables: 22 nodes (10 exogenous + 12 endogenous) + regime column.
# Distributions per paper Sec. IV; items marked assumed: true are not fixed by
# the paper.
#
# Not an SCM node: the offered traffic lambda in rho = lambda/mac_tput is a
# fixed constant (network.arrival_mbps in simulator.yaml).

exogenous:
  cell_load:      {symbol: L,      layer: 0, dist: "Beta(2,2)",        role: confounder}
  shadow_fading:  {symbol: xi_sf,  layer: 0, dist: "Normal(0,49)",     unit: dB, role: effect_modifier}
  hw_impairment:  {symbol: xi_hw,  layer: 0, dist: "Normal(0,2.25)",   role: effect_modifier}
  traffic_burst:  {symbol: xi_tb,  layer: 0, dist: "LogNormal(0,0.12)", role: effect_modifier, note: "xi_tb = C_a^2, the squared coefficient of variation of inter-arrival times: 1 = Poisson, >1 burstier, <1 more regular; LogNormal(0,0.12) is centred near 1"}
  snr:            {symbol: snr,    layer: 0, dist: "Uniform(2,28)",    unit: dB}
  doppler:        {symbol: dop,    layer: 0, dist: "Uniform(5,200)",   unit: Hz, assumed: true}
  delay_spread:   {symbol: ds,     layer: 0, dist: "Uniform(30,300)",  unit: ns, assumed: true}
  eps_sinr:       {symbol: eps1,   layer: 0, dist: "Normal(0,0.25)",   unit: dB, assumed: true}
  eps_sched:      {symbol: epsT,   layer: 0, dist: "round(Normal(0,10.5))", unit: PRB, assumed: true}
  eps_queue:      {symbol: eps3,   layer: 0, dist: "Normal(0,0.01)",   assumed: true}

endogenous:
  # L1 PHY
  sinr_eff:   {layer: 1, eq: "eq1: snr + xi_sf - beta_L*L - dop_pen - ds_pen + eps1", unit: dB}
  mcs_idx:    {layer: 1, eq: "highest MCS with BLER(sinr_eff, mcs) <= 0.1"}
  mod_order:  {layer: 1, eq: "MCS table lookup m"}
  code_rate:  {layer: 1, eq: "MCS table lookup r"}
  bler:       {layer: 1, eq: "BLER(sinr_eff, mcs_idx) via PHYBackend (Sionna | analytical)"}
  se_phy:     {layer: 1, eq: "mod_order * code_rate (nominal MCS spectral efficiency; decoding failure enters once, in pkt_loss)"}
  # L2 MAC
  num_prb:    {layer: 2, eq: "eq2: floor(100*(1 - alpha_L*L)) + epsT (obs) | t (do)", role: treatment}
  harq_retx:  {layer: 2, eq: "eq3: sum_{k=1..3} bler^k, expected HARQ retransmissions (fractional, range 0-3)"}
  mac_tput:   {layer: 2, eq: "max(C0 * num_prb * se_phy*(1+kappa_hw*xi_hw) / (1+kappa_harq*harq_retx), tput_floor_mbps): service rate after retransmission overhead"}
  # L3 Network
  queue_dep:  {layer: 3, eq: "eq4: [rho^2*xi_tb/(2(1-rho)) + eps3]_+, rho = min(lambda/mac_tput, rho_max): GI/G/1 mean queue backlog with C_s^2 = 0"}
  pkt_loss:   {layer: 3, eq: "eq5: 1 - (1 - bler^(1+K_H))*exp(-max(0, queue_dep-q_thr)/q_scale), K_H = harq_max_rounds", note: "mac_tput is not a parent (goodput = mac_tput*(1-pkt_loss) already carries the service limit); harq_retx is not a parent (the residual decoding failure after 1+K_H independent attempts is bler^(1+K_H))"}
  goodput:    {layer: 3, eq: "mac_tput * (1 - pkt_loss)", role: outcome}
